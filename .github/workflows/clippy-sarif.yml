# Rust lint results in GitHub code scanning.
#
# Rust is not a CodeQL language, so this is the only way `cargo clippy` findings
# appear in the Security -> Code scanning tab. It reports; it does not gate
# (ci.yml already runs clippy with `-D warnings`).

name: Clippy (SARIF)

on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*', '.github/workflows/clippy-sarif.yml']
  pull_request:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install SARIF converters
        run: cargo install clippy-sarif sarif-fmt

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            --message-format=json | clippy-sarif | tee clippy.sarif | sarif-fmt

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: clippy.sarif
          category: clippy
