# OSSF Scorecard: supply-chain posture (branch protection, pinning, token
# permissions, dangerous workflows). Results publish to the OpenSSF API and
# upload to code scanning.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1'
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard is an advisory report, not a release gate. Its action ships as a
    # container image, and a registry outage fails the job *before* any step
    # runs, which step-level continue-on-error cannot catch — so keep the job
    # itself non-blocking too.
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # Pinned to v2.4.4 because it publishes to ghcr.io. v2.4.0 and earlier
        # pulled gcr.io/openssf/scorecard-action, which now fails for everyone
        # with "This API method requires billing to be enabled".
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF
        # Only when the analysis produced a file (a Docker pull flake leaves none).
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: results.sarif
          category: scorecard
